<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — iRonic Health</title>
<link rel="icon" href="/assets/h-badge-blue.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Cairo:wght@400;600;700&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Ubuntu',system-ui,sans-serif;color:#1A2332;background:#FAFAF8;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  .ih-nav{height:70px;display:flex;align-items:center;padding:0 56px;background:rgba(255,255,255,.92);border-bottom:1px solid #E2EAF3}
  .ih-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
  .ih-brand img{width:34px;height:34px;display:block}
  .ih-brand span{font-size:18px;font-weight:700;letter-spacing:-.4px;color:#1A2332}
  .ih-brand b{color:#4179AD;font-weight:700}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 24px}
  .ih-card{width:100%;max-width:560px;text-align:center}
  .ih-code{font-weight:700;font-size:64px;letter-spacing:-2px;color:#4179AD;line-height:1;margin:0 0 20px}
  .ih-block + .ih-block{margin-top:36px;padding-top:36px;border-top:1px solid #E2EAF3}
  h1{font-size:28px;letter-spacing:-.6px;color:#1E3048;margin:0 0 10px}
  p{font-size:16px;color:#3D4F63;margin:0 0 22px}
  .ih-btn{display:inline-flex;align-items:center;background:#4179AD;color:#fff;font-size:15px;font-weight:500;padding:13px 26px;border-radius:8px;text-decoration:none}
  .ih-btn:hover{background:#35689A}
  .ih-ar{font-family:'Cairo',sans-serif}
  .ih-ar h1{letter-spacing:0}
  footer{padding:24px;text-align:center;font-size:13px;color:#6B7F96}
  footer a{color:#4179AD;text-decoration:none}
  @media(max-width:600px){.ih-nav{padding:0 16px}.ih-code{font-size:52px}h1{font-size:24px}}
</style>
</head>
<body>
  <nav class="ih-nav">
    <a class="ih-brand" href="/"><img src="/assets/h-badge-blue.svg" alt="iRonic Health"><span>iRonic <b>Health</b></span></a>
  </nav>
  <main>
    <div class="ih-card">
      <div class="ih-code">404</div>
      <section class="ih-block">
        <h1>Page not found</h1>
        <p>This page may have moved or is no longer available.</p>
        <a class="ih-btn" href="/">Back to the homepage</a>
      </section>
      <section class="ih-block ih-ar" lang="ar" dir="rtl">
        <h1>الصفحة غير موجودة</h1>
        <p>ربما نُقلت هذه الصفحة أو لم تعد متاحة.</p>
        <a class="ih-btn" href="/ar/">العودة إلى الصفحة الرئيسية</a>
      </section>
    </div>
  </main>
  <footer><a href="mailto:info@ironichealth.com">info@ironichealth.com</a></footer>
</body>
</html>
